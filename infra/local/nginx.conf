# Nginx del staging local: hace el papel del Nginx del host del VPS (infra/nginx/sapef.conf.example)
# con un certificado de una CA local, para probar desde el PC y desde teléfonos de la misma red.
#   https://<ip>:8443  web de oficina
#   https://<ip>:8444  app de campo (PWA)
#   http://<ip>:8080   solo para descargar el certificado de la CA (ca.crt) e instalarlo en el teléfono

upstream sapef_api {
    # La API del proyecto sapef-local, por la red interna de Compose.
    server api:8000;
    keepalive 16;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /certs/servidor.crt;
    ssl_certificate_key /certs/servidor.key;

    root /srv/estaticos/actual/web;
    index index.html;
    client_max_body_size 256m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://sapef_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # Caché con «expires» y no con add_header: un add_header dentro de un location anula los
    # encabezados de seguridad del server (herencia de Nginx).
    location /assets/ { expires 1y; }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

server {
    listen 8444 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /certs/servidor.crt;
    ssl_certificate_key /certs/servidor.key;

    root /srv/estaticos/actual/campo;
    index index.html;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    location /api/ {
        proxy_pass http://sapef_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /sw.js { expires -1; }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }
    # Caché con «expires» y no con add_header: un add_header dentro de un location anula los
    # encabezados de seguridad del server (herencia de Nginx).
    location /assets/ { expires 1y; }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

# Solo el certificado público de la CA local; nada más se sirve sin cifrar.
server {
    listen 8080;
    server_name _;
    root /certs-publicos;
    location = /ca.crt {
        types { }
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="sapef-local-ca.crt"' always;
    }
    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SAPEF local</title><body style="font-family:sans-serif;max-width:36rem;margin:2rem auto;padding:0 1rem"><h1>SAPEF staging local</h1><p>1. Descargue e instale el <a href="/ca.crt">certificado de la CA local</a>.</p><p>Android: Ajustes &gt; Seguridad &gt; Cifrado y credenciales &gt; Instalar un certificado &gt; Certificado de CA.<br>iPhone: abrir en Safari, instalar el perfil en Ajustes y activar la confianza total en Ajustes &gt; General &gt; Información &gt; Ajustes de confianza de certificados.</p><p>2. App de campo: <b>https://$host:8444</b> &middot; Web de oficina: <b>https://$host:8443</b></p><p>Al terminar las pruebas, quite el certificado del teléfono.</p></body>';
    }
    location / { return 404; }
}
