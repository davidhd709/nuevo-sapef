[pytest]
testpaths = .
pythonpath = .
addopts = --strict-markers --strict-config -ra
markers =
    tier1: Tier 1 happy-path feature coverage tests
    tier2: Tier 2 boundary, error, and security tests
    tier3: Tier 3 cross-feature pairwise integration workflows
    tier4: Tier 4 real-world municipal end-to-end scenarios
    fase0: Fase 0 core health, tasks, RFC 9457, and OpenAPI contract checks
    browser: Headless Chromium browser tests for apps/web and apps/campo
    commercial: Commercial OPainn (EP-08) parity, adapters, and deliverables tests
    pwa: Field app (apps/campo) offline PWA, IndexedDB, and ServiceWorker tests
    isolation: Multi-sede tenant isolation and RBAC/PII security tests
